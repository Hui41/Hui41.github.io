
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{% raw %}{{ page.title }}{% endraw %} | Hui Liu</title>

  <link rel="stylesheet" href="{% raw %}{{ '/style2.css' | relative_url }}{% endraw %}">

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['\\(', '\\)']],
        displayMath: [['\\[', '\\]'], ['$$', '$$']],
        tags: 'ams',
        macros: {
          dbb: '\\bar{\\partial}_b',
          Ric: '\\operatorname{Ric}'
        }
      }
    };
  </script>
  <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  <meta name="robots" content="noindex, nofollow">
</head>
<body>
  <main class="container">
    <p><a href="/">Home</a> /
       <a href="/notes/">Mathematical Notes</a></p>

    <h1>{% raw %}{{ page.title }}{% endraw %}</h1>

    <article>
      {% raw %}{{ content }}{% endraw %}
    </article>
  </main>
</body>
</html>
