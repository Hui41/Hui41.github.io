
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>{{ page.title }} | Hui Liu</title>

  <meta name="robots" content="noindex, nofollow">

  <link rel="stylesheet" href="{{ '/style2.css' | relative_url }}">

  <style>
    .math-notes {
      max-width: 900px;
      margin: 50px auto;
      padding: 0 25px;
      line-height: 1.8;
      font-size: 17px;
    }

    .math-notes article {
      margin-top: 35px;
    }

    .math-notes h2 {
      margin-top: 35px;
    }

    mjx-container[display="true"] {
      overflow-x: auto;
      overflow-y: hidden;
    }
  </style>

  <script>
    window.MathJax = {
      tex: {
        inlineMath: [['$', '$'], ['\\(', '\\)']],
        displayMath: [['$$', '$$'], ['\\[', '\\]']],
        processEscapes: true,
        tags: 'ams',
        macros: {
          dbb: '\\bar{\\partial}_b',
          Ric: '\\operatorname{Ric}'
        }
      }
    };
  </script>

  <script defer
    src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js">
  </script>
</head>

<body>
  <main class="math-notes">

    <nav>
      <a href="/notes/">Mathematical Notes</a>
    </nav>

    <h1>{{ page.title }}</h1>

    <article>
      {{ content }}
    </article>

  </main>
</body>
</html>
